[package]
name = "pd-edge-abi"
version.workspace = true
edition.workspace = true
description = "ABI definitions for RustScript edge host functions"
license = "MIT"
homepage = "https://rustscript.org/"
repository = "https://github.com/rustscript-lang/pd-edge"
build = "build.rs"

[lib]
name = "edge_abi"

[features]
default = ["console", "http", "tls", "websocket"]
console = []
http = []
http2 = ["http"]
mqtt = []
tls = []
websocket = ["http"]
webrtc = ["http"]

[dependencies]
pd-host-function = { git = "https://github.com/rustscript-lang/rustscript.git", rev = "b1d6cffede77f49410bf63525f30b9a46b02dc01", version = "0.1.0" }

[build-dependencies]
syn = { version = "2", features = ["full"] }
