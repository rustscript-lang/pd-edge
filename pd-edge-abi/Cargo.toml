[package]
name = "pd-edge-abi"
version.workspace = true
edition.workspace = true
description = "ABI definitions for RustScript edge host functions"
license = "MIT"
homepage = "https://rustscript.org/"
repository = "https://github.com/rustscript-lang/pd-edge"
build = "build.rs"

[lib]
name = "edge_abi"

[features]
default = ["console", "http", "tls", "websocket"]
console = []
http = []
http2 = ["http"]
mqtt = []
tls = []
websocket = ["http"]
webrtc = ["http"]

[dependencies]
pd-host-function = { git = "https://github.com/rustscript-lang/rustscript.git", rev = "2f433edab3f1907e8cb060e901357d7e2af016ce", version = "0.1.0" }
# The ABI declarations are real Rust signatures of the guest contract, so the
# fallible optional-text return needs the core SDK's `GuestResult`/`GuestOption`
# value types. Both are exported by the core crate root without any feature, so
# this dependency stays feature-free: enabling `runtime` here would leak the VM
# runtime into every consumer's compiler-only graph through feature unification.
# The pin must match the runtime's `pd-vm` pin in the root manifest.
vm = { package = "pd-vm", git = "https://github.com/rustscript-lang/rustscript.git", rev = "2f433edab3f1907e8cb060e901357d7e2af016ce", version = "0.1.0", default-features = false }

[build-dependencies]
syn = { version = "2", features = ["full"] }
