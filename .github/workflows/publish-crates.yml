name: Publish crates

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish. Defaults to the pushed tag name without leading v.'
        required: false
        type: string
      pd_vm_version:
        description: 'pd-vm dependency version override'
        required: false
        type: string
      pd_host_function_version:
        description: 'pd-host-function dependency version override'
        required: false
        type: string

concurrency:
  group: publish-crates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PACKAGE_ORDER: pd-edge-host-function pd-edge-abi pd-edge
      PD_VM_VERSION: ${{ inputs.pd_vm_version || '0.22.2' }}
      PD_HOST_FUNCTION_VERSION: ${{ inputs.pd_host_function_version || '0.22.2' }}
      PUBLISH_STAGE: ${{ runner.temp }}/publish-crates
    steps:
      - name: Checkout pd-edge
        uses: actions/checkout@v4
        with:
          path: pd-edge
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      # crates.io publishes each package from its own staged tree, so the
      # rustscript checkout is not needed: pd-vm / pd-host-function git
      # dependencies are rewritten to registry versions by the prepare step.
      - name: Prepare publish trees
        working-directory: pd-edge
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          if [[ -z "$version" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ -z "$version" ]]; then
            echo "version is required" >&2
            exit 1
          fi
          rm -rf "$PUBLISH_STAGE"
          python3 .github/scripts/prepare_publish.py \
            --workspace-root . \
            --out "$PUBLISH_STAGE" \
            --version "$version" \
            --package-order $PACKAGE_ORDER \
            --registry-dep "pd-vm=${PD_VM_VERSION}" \
            --registry-dep "pd-host-function=${PD_HOST_FUNCTION_VERSION}"
      - name: Publish crates
        working-directory: pd-edge
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "CARGO_REGISTRY_TOKEN is required" >&2
            exit 1
          fi
          python3 .github/scripts/publish_crates.py --plan "$PUBLISH_STAGE/publish-plan.json"
